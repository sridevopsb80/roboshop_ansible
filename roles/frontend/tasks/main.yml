# Use dnf module to install specified nginx
- name: Install Nginx
  ansible.builtin.dnf:
    name: nginx
    state: latest

# Copy file using template module. Check bottom for more comments
- name: Copy nginx config file
  ansible.builtin.template:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf

# Use include_role to include a task from another role
- name: Setup App Prerequisites
  ansible.builtin.include_role: 
    name: common # calling from role common
    tasks_from: app-prereq # task name. .yml need not be mentioned.

# Using systemd_service module to enable and restart nginx 
- name: Start Nginx Service
  ansible.builtin.systemd_service:
    state: restarted
    name: nginx
    enabled: true

