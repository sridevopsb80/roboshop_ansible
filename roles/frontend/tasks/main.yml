# Disable default nginx stream using shell module since dnf module cannot
# Note: Shell module is not idempotent. Ansible might execute these steps every time

- name: Disable default nginx module
  ansible.builtin.shell: dnf module disable nginx -y

- name: Enable Nginx 24 Version
  ansible.builtin.shell: dnf module enable nginx:1.24 -y

